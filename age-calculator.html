<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Calculator — Calculate Exact Age from Date of Birth | SitPanda</title>
  <meta name="description" content="Find your exact age in years, months, days, hours, and minutes.">
  <link rel="canonical" href="https://sitpanda.com/age-calculator.html">
  <style>
    :root { --brand:#0F766E; --bg:#F8FAFC; --card:#FFF; --ink:#0F172A; --ink2:#475569; --border:#E2E8F0; --radius:16px; --shadow:0 4px 16px rgba(15,23,42,0.08); }
    body.dark { --bg:#0B1120; --card:#1E293B; --ink:#F1F5F9; --ink2:#CBD5E1; --border:#334155; --brand:#2DD4BF; }
    *{margin:0;padding:0;box-sizing:border-box} body{font-family:"Inter",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
    .container{max-width:600px;margin:0 auto;padding:0 24px} a{text-decoration:none;color:inherit}
    .site-header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 0}
    .header-inner{display:flex;justify-content:space-between;align-items:center}
    .logo{font-weight:800;font-size:1.3rem;display:flex;gap:10px;align-items:center}
    .theme-toggle{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--border);cursor:pointer;font-size:1.2rem}
    .page-title{font-size:2rem;font-weight:800;margin:32px 0 8px} .page-sub{color:var(--ink2);margin-bottom:22px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);margin-bottom:24px}
    .input-group{margin-bottom:18px} .input-group label{display:block;font-weight:600;margin-bottom:6px}
    .input-row input{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg);color:var(--ink);font-size:1rem}
    .result-main{font-size:2.2rem;font-weight:800;color:var(--brand);margin:16px 0;text-align:center}
    .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px;padding-top:20px;border-top:1px solid var(--border);text-align:center}
    .result-item .label{font-size:0.8rem;color:var(--ink2);text-transform:uppercase} .result-item .value{font-size:1.1rem;font-weight:700}
    .site-footer{text-align:center;padding:36px 0;border-top:1px solid var(--border);margin-top:40px;font-size:0.82rem;color:var(--ink2)}
  </style>
</head>
<body>
<header class="site-header"><div class="container header-inner"><a href="/" class="logo">🐼 SitPanda</a><button class="theme-toggle" id="themeToggle">🌙</button></div></header>
<main class="container">
  <h1 class="page-title">Age Calculator</h1>
  <p class="page-sub">Calculate your exact age in years, months, days, and hours.</p>
  <div class="card">
    <div class="input-group"><label>Date of Birth</label><input type="date" id="dob"></div>
    <div class="input-group"><label>Age at the Date of</label><input type="date" id="targetDate"></div>
    <div class="result-main" id="mainAge">0 Years, 0 Months, 0 Days</div>
    <div class="result-grid">
      <div class="result-item"><div class="label">Total Months</div><div class="value" id="totalMonths">0</div></div>
      <div class="result-item"><div class="label">Total Days</div><div class="value" id="totalDays">0</div></div>
    </div>
  </div>
</main>
<footer class="site-footer">© 2026 SitPanda.</footer>
<script>
  const themeToggle=document.getElementById('themeToggle'); if(localStorage.getItem('theme')==='dark'){document.body.classList.add('dark');themeToggle.textContent='☀️'} themeToggle.onclick=()=>{document.body.classList.toggle('dark');const d=document.body.classList.contains('dark');themeToggle.textContent=d?'☀️':'🌙';localStorage.setItem('theme',d?'dark':'light')};
  const dob=document.getElementById('dob'),target=document.getElementById('targetDate');
  function calc(){ if(!dob.value||!target.value) return; const d1=new Date(dob.value),d2=new Date(target.value); if(d1>d2){document.getElementById('mainAge').textContent='Invalid Date';return;}
    let y=d2.getFullYear()-d1.getFullYear(),m=d2.getMonth()-d1.getMonth(),d=d2.getDate()-d1.getDate(); if(d<0){m--;const lastDay=new Date(d2.getFullYear(),d2.getMonth(),0).getDate();d+=lastDay;} if(m<0){y--;m+=12;}
    document.getElementById('mainAge').textContent=`${y} Years, ${m} Months, ${d} Days`;
    const diffMs=d2-d1; document.getElementById('totalMonths').textContent=(y*12+m); document.getElementById('totalDays').textContent=Math.floor(diffMs/(1000*60*60*24)).toLocaleString();}
  const today=new Date().toISOString().split('T')[0]; target.value=today; dob.value='2000-01-01'; [dob,target].forEach(el=>el.addEventListener('input',calc)); calc();
</script>
</body>
</html>
