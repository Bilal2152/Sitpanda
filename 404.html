<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — SitPanda</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      --brand: #0F766E; --brand-hover: #0D9488;
      --bg: #F8FAFC; --card: #FFFFFF; --ink: #0F172A;
      --ink-secondary: #475569; --muted: #94A3B8;
      --border: #E2E8F0; --shadow: 0 4px 16px rgba(15,23,42,0.08);
    }
    body.dark {
      --bg: #0B1120; --card: #1E293B; --ink: #F1F5F9;
      --ink-secondary: #CBD5E1; --muted: #64748B; --border: #334155;
      --brand: #2DD4BF; --brand-hover: #5EEAD4;
      --shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", -apple-system, sans-serif;
      background: var(--bg); color: var(--ink);
      min-height: 100vh; display: grid; place-items: center;
      padding: 24px; text-align: center;
      transition: background 0.2s, color 0.2s;
    }
    .container { max-width: 540px; }
    .panda { font-size: 5rem; margin-bottom: 16px; display: block; }
    h1 {
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      font-weight: 800; letter-spacing: -0.5px;
      margin-bottom: 12px;
    }
    h1 .highlight { color: var(--brand); }
    p {
      color: var(--ink-secondary); font-size: 1.05rem;
      line-height: 1.6; margin-bottom: 32px;
    }
    .actions {
      display: flex; gap: 12px; justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 12px 24px; border-radius: 999px;
      font-weight: 600; font-size: 0.95rem;
      transition: all 0.2s; text-decoration: none;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-primary {
      background: var(--brand); color: #fff;
      border: 1px solid var(--brand);
    }
    .btn-primary:hover {
      background: var(--brand-hover);
      border-color: var(--brand-hover);
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: var(--card); color: var(--ink);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      border-color: var(--brand); color: var(--brand);
      transform: translateY(-2px);
    }
    .suggestions {
      margin-top: 40px; padding: 20px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; box-shadow: var(--shadow);
    }
    .suggestions p {
      margin-bottom: 12px; font-size: 0.9rem;
      color: var(--ink-secondary);
    }
    .suggestion-links {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center;
    }
    .suggestion-links a {
      padding: 6px 14px; border-radius: 999px;
      font-size: 0.82rem; font-weight: 600;
      color: var(--brand);
      background: rgba(15,118,110,0.1);
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .suggestion-links a:hover {
      background: var(--brand); color: #fff;
    }
    .theme-toggle {
      position: fixed; top: 20px; right: 20px;
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--card); border: 1px solid var(--border);
      display: grid; place-items: center;
      font-size: 1.2rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>

  <div class="container">
    <span class="panda">🐼</span>
    <h1>Oops! This page <span class="highlight">wandered off.</span></h1>
    <p>The page you are looking for does not exist, was removed, or the URL was typed incorrectly.</p>

    <div class="actions">
      <a href="/" class="btn btn-primary">← Go to Homepage</a>
      <a href="/#finance" class="btn btn-secondary">Browse Calculators</a>
    </div>

    <div class="suggestions">
      <p><strong>Popular calculators:</strong></p>
      <div class="suggestion-links">
        <a href="/mortgage-calculator">Mortgage</a>
        <a href="/loan-calculator">Loan</a>
        <a href="/compound-interest-calculator">Compound Interest</a>
        <a href="/bmi-calculator">BMI</a>
        <a href="/percentage-calculator">Percentage</a>
        <a href="/age-calculator">Age</a>
      </div>
    </div>
  </div>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
      themeToggle.textContent = '☀️';
    }
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      themeToggle.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
  </script>
</body>
</html>
