<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator — Free Body Mass Index Calculator | SitPanda</title>
  <meta name="description" content="Calculate your Body Mass Index (BMI) using metric or imperial units. Understand your weight category based on WHO standards.">
  <link rel="canonical" href="https://sitpanda.com/bmi-calculator.html">
  <style>
    :root { --brand:#0F766E; --bg:#F8FAFC; --card:#FFF; --ink:#0F172A; --ink2:#475569; --border:#E2E8F0; --radius:16px; --shadow:0 4px 16px rgba(15,23,42,0.08); }
    body.dark { --bg:#0B1120; --card:#1E293B; --ink:#F1F5F9; --ink2:#CBD5E1; --border:#334155; --brand:#2DD4BF; }
    *{margin:0;padding:0;box-sizing:border-box} body{font-family:"Inter",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
    .container{max-width:800px;margin:0 auto;padding:0 24px} a{text-decoration:none;color:inherit}
    .site-header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 0}
    .header-inner{display:flex;justify-content:space-between;align-items:center}
    .logo{font-weight:800;font-size:1.3rem;display:flex;gap:10px;align-items:center}
    .theme-toggle{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--border);cursor:pointer;font-size:1.2rem}
    .page-title{font-size:2rem;font-weight:800;margin:32px 0 8px} .page-sub{color:var(--ink2);margin-bottom:22px}
    .calc-layout{display:grid;grid-template-columns:1fr;gap:24px}
    .form-card,.result-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
    .input-group{margin-bottom:18px} .input-group label{display:block;font-size:0.88rem;font-weight:600;margin-bottom:6px}
    .input-row{display:flex;gap:8px} .input-row input{flex:1;padding:12px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg);color:var(--ink);font-size:1rem}
    .toggle-tabs{display:flex;gap:8px;margin-bottom:20px}
    .tab-btn{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg);font-weight:600;cursor:pointer}
    .tab-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
    .result-card{background:linear-gradient(160deg,rgba(15,118,110,0.1),var(--card) 60%);border-color:var(--brand)}
    .result-main{font-size:2.4rem;font-weight:800;color:var(--brand);margin:8px 0}
    .status-box{margin-top:16px;padding:14px;border-radius:10px;font-weight:600;text-align:center}
    .site-footer{text-align:center;padding:36px 0;border-top:1px solid var(--border);margin-top:40px;font-size:0.82rem;color:var(--ink2)}
  </style>
</head>
<body>
<header class="site-header"><div class="container header-inner"><a href="/" class="logo">🐼 SitPanda</a><button class="theme-toggle" id="themeToggle">🌙</button></div></header>
<main class="container">
  <h1 class="page-title">BMI Calculator</h1>
  <p class="page-sub">Calculate your Body Mass Index based on WHO standards.</p>
  <div class="calc-layout">
    <div class="form-card">
      <div class="toggle-tabs">
        <button class="tab-btn active" data-unit="metric">Metric (kg / cm)</button>
        <button class="tab-btn" data-unit="imperial">Imperial (lb / ft)</button>
      </div>
      <div class="input-group">
        <label>Weight</label>
        <div class="input-row"><input type="number" id="weight" value="70"><span id="weightUnit">kg</span></div>
      </div>
      <div class="input-group" id="heightMetric">
        <label>Height (cm)</label>
        <div class="input-row"><input type="number" id="heightCm" value="175"></div>
      </div>
      <div class="input-group" id="heightImperial" style="display:none;">
        <label>Height (ft / in)</label>
        <div class="input-row"><input type="number" id="heightFt" value="5" placeholder="ft"><input type="number" id="heightIn" value="9" placeholder="in"></div>
      </div>
    </div>
    <div class="result-card">
      <div>Your BMI</div><div class="result-main" id="bmiValue">0.0</div>
      <div>Category: <span id="bmiCategory" style="font-weight:700;color:var(--brand)">-</span></div>
      <div class="status-box" id="statusBox" style="background:rgba(15,118,110,0.1);color:var(--brand)">Enter details.</div>
    </div>
  </div>
</main>
<footer class="site-footer">© 2026 SitPanda.</footer>
<script>
  const themeToggle=document.getElementById('themeToggle'); if(localStorage.getItem('theme')==='dark'){document.body.classList.add('dark');themeToggle.textContent='☀️'} themeToggle.onclick=()=>{document.body.classList.toggle('dark');const d=document.body.classList.contains('dark');themeToggle.textContent=d?'☀️':'🌙';localStorage.setItem('theme',d?'dark':'light')};
  let unit='metric'; document.querySelectorAll('.tab-btn').forEach(btn=>{btn.onclick=()=>{document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');unit=btn.dataset.unit;
    if(unit==='metric'){document.getElementById('heightMetric').style.display='block';document.getElementById('heightImperial').style.display='none';document.getElementById('weightUnit').textContent='kg';}
    else{document.getElementById('heightMetric').style.display='none';document.getElementById('heightImperial').style.display='block';document.getElementById('weightUnit').textContent='lb';}
    calculate();}});
  function calculate(){let w=parseFloat(document.getElementById('weight').value)||0,bmi=0,h=0;
    if(unit==='metric'){h=(parseFloat(document.getElementById('heightCm').value)||0)/100; if(h>0)bmi=w/(h*h);}
    else{let ft=parseFloat(document.getElementById('heightFt').value)||0,inc=parseFloat(document.getElementById('heightIn').value)||0; h=(ft*12+inc); if(h>0)bmi=(w/(h*h))*703;}
    if(bmi>0&&bmi<Infinity){document.getElementById('bmiValue').textContent=bmi.toFixed(1);let cat='';let c='';
      if(bmi<18.5){cat='Underweight';c='#1E40AF';} else if(bmi<25){cat='Normal';c='#166534';} else if(bmi<30){cat='Overweight';c='#92400E';} else {cat='Obese';c='#991B1B';}
      document.getElementById('bmiCategory').textContent=cat; document.getElementById('statusBox').textContent='Your BMI is '+cat; document.getElementById('statusBox').style.color=c;
    } else {document.getElementById('bmiValue').textContent='0.0'; document.getElementById('bmiCategory').textContent='-';}}
  document.querySelectorAll('input').forEach(el=>el.addEventListener('input',calculate)); calculate();
</script>
</body>
</html>
